name: Vietlott Update

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 13 * * wed,fri,sun' # 20:00 Vietnam time on Wed/Fri/Sun (2 hours after the 18:00 draw)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Run bot script
        run: |
          python vietlott.py
        # A blocked or changed upstream source must fail the run instead of
        # appearing successful with an unchanged workbook.

      - name: Rebuild complete Excel history
        run: |
          python repair_workbook.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Vietlott_Mega_645_Full_Results.xlsx vietlott.db results.html
          if git diff --cached --quiet; then
            echo "No Vietlott data changes to commit."
          else
            git commit -m "chore: update vietlott results"
            git push origin main
          fi
